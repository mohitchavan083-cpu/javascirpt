<!DOCTYPE html>
<html>
<head>
    <title>Sum of Natural Numbers</title>
</head>
<body>

<h2>Sum of Natural Numbers</h2>

<script>
    let n = parseInt(prompt("Enter a number:"));
    let sum = 0;

    for (let i = 1; i <= n; i++) {
        sum += i;
    }

    document.write("Sum of first " + n + " natural numbers is: " + sum);
</script>

</body>
</html>
