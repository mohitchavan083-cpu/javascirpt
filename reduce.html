<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const number = [1, 2, 3, 4, 5]

console.log("----- Reduce Function Without Initial Value -----")

const sum = number.reduce(function (acc, element) {
    return acc + element
})

console.log(sum)


const num = [1, 2, 3, 4, 5]

console.log("----- Reduce Function With Initial Value -----")

const sum1 = num.reduce(function (acc, element) {
    return acc + element
}, 5)

console.log(sum1)


console.log("----- Reduce To Find Maximum Value -----")

const max = number.reduce(function (acc, element) {
    return Math.max(acc, element)
})

console.log(max)


console.log("----- Reduce To Find Minimum Value -----")

const min = number.reduce(function (acc, element) {
    return Math.min(acc, element)
})

console.log(min)
    </script>
</body>
</html>
