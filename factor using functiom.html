<!DOCTYPE html>
<html>
<head>
    <title>Factor Program</title>
</head>
<body>

<h2>Find Factors of a Number</h2>

<script>
    let number = parseInt(prompt("Enter a number:"));

    console.log("Factors of " + number + " are:");

    for (let i = 1; i <= number; i++) {
        if (number % i === 0) {
            console.log(i);
            document.write(i + "<br>");
        }
    }
</script>

</body>
</html>
